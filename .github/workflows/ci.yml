name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # engines says >=22.19; prove the floor and the current LTS line.
        node: ["22.19", "22", "24"]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5 # version comes from packageManager
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify
